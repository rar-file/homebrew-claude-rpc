name: Bump formula

# Keeps Formula/claude-rpc.rb on the latest npm release, so a claude-rpc
# release needs no manual tap commit. Runs hourly; the main repo's release
# workflow can also fire `repository_dispatch` (type: npm-published) for an
# immediate bump.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [npm-published]

permissions:
  contents: write

concurrency:
  group: bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Update formula from npm
        id: bump
        run: node .github/scripts/bump.mjs

      - name: Commit
        if: steps.bump.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "claude-rpc ${{ steps.bump.outputs.version }}"
          git push
